name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test          # se detiene en la etapa de tests, no llega a final
          load: true            # la baja al Docker del runner para poder correrla
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      # Si un test falla o la cobertura no llega al fail_under de .coveragerc, pytest sale
      # con error, el docker run también, y el job queda rojo.
      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -v "${{ github.workspace }}/backend-coverage:/out" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/coverage.json
          test -f "$F"          # si no está, el paso falla: mejor rojo que un resumen vacío
          python3 - "$F" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import configparser, json, sys
          t = json.load(open(sys.argv[1]))['totals']
          if not t['num_statements']:
              sys.exit('midió 0 líneas: revisá el omit de backend/.coveragerc')
          rc = configparser.ConfigParser()
          rc.read('backend/.coveragerc')
          umbral = rc['report']['fail_under']
          print('### Coverage del backend')
          print('| métrica | cubierto | % |')
          print('|---|---|---|')
          print(f"| líneas | {t['covered_lines']}/{t['num_statements']} | {t['percent_statements_covered']:.2f}% |")
          print(f"| ramas | {t['covered_branches']}/{t['num_branches']} | {t['percent_branches_covered']:.2f}% |")
          cubierto = t['covered_lines'] + t['covered_branches']
          total = t['num_statements'] + t['num_branches']
          print(f"| **líneas + ramas (umbral: {umbral}%)** | {cubierto}/{total} | **{t['percent_covered']:.2f}%** |")
          EOF

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}   # /health lo devuelve: el smoke lo compara
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      # Si un test falla o la cobertura no llega a los thresholds de vite.config.js, vitest
      # sale con error, el docker run también, y el job queda rojo.
      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"          # si no está, el paso falla: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include de vite.config.js'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].covered}/\${t[m].total} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend (umbral: 90% en líneas y en ramas)');
            console.log('| métrica | cubierto | % |'); console.log('|---|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read # sólo dispara hooks y hace curl: no escribe nada en el repo
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; solo main despliega
    environment: qa
    steps:
      # Render ya no construye: ejecuta la imagen que le nombra imgURL, la que publicaron
      # los jobs de build de ESTA corrida. --get --data-urlencode la agrega con & (el hook
      # ya trae ?key=) y le codifica los : y /. La URL del hook va última: es el único
      # argumento suelto, y --data-urlencode se lleva el valor que tiene al lado.
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      # Reintenta porque Render tarda en bajar la imagen y el free tier tiene cold start.
      # Pasa solo si la api contesta con el commit horneado en la imagen de ESTA corrida
      # (no la versión vieja) y su base responde, y el front sirve la página y llega a SU
      # api a través de nginx. La api va primero: la despierta antes de pasar por el front.
      - name: Smoke test (espera a que QA conteste con este commit)
        shell: bash
        env:
          URL_API: https://club-tablada-api-qa.onrender.com
          URL_FRONT: https://club-tablada-front-qa.onrender.com
        run: |
          echo "Esperando a que QA corra $GITHUB_SHA..."
          for i in $(seq 1 30); do
            HEALTH=$(curl -fsS --max-time 10 "$URL_API/api/v1/health/" || true)
            echo "intento $i: $HEALTH"
            if [[ "$HEALTH" == *"\"commit\":\"$GITHUB_SHA\""* ]] \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/v1/health/" > /dev/null; then
              echo "✅ QA responde con $GITHUB_SHA (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió con este commit a tiempo"; exit 1

  # Integración: pedidos HTTP a la api de QA (la que ejecuta la imagen de ESTA corrida),
  # con su base de verdad, sin navegador y sin dobles. Va antes de la e2e: es más rápida
  # y más barata, y si la api está rota no vale la pena levantar un browser para confirmarlo.
  integracion:
    runs-on: ubuntu-latest
    permissions:
      contents: read # baja el código y corre los pedidos a QA
    needs: deploy-qa
    timeout-minutes: 15
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (sin navegador)
        run: npm ci
        working-directory: ./frontend

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://club-tablada-api-qa.onrender.com   # la API, no el front
          E2E_PASSWORD_ENTRENADOR: ${{ secrets.E2E_PASSWORD_ENTRENADOR }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Resumen de la integración
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/resumen-playwright.js "Integración (api de QA)" >> "$GITHUB_STEP_SUMMARY"
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion   # distinto del de e2e: dos iguales rompen la corrida
          path: frontend/playwright-report
          retention-days: 90                     # el máximo: tienen que seguir ahí en la defensa

  # e2e: un Chromium de verdad usando el front de QA, que le habla a su api y a su base.
  # Si la integración falló, no corre: su needs no se cumple.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read # baja el código y corre el navegador contra QA
    needs: integracion
    timeout-minutes: 20               # si algo se cuelga, el job muere en vez de esperar horas
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y el navegador
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra el front de QA
        env:
          E2E_BASE_URL: https://club-tablada-front-qa.onrender.com   # el FRONT de QA
          E2E_PASSWORD_ENTRENADOR: ${{ secrets.E2E_PASSWORD_ENTRENADOR }}
          E2E_PASSWORD_JUGADOR: ${{ secrets.E2E_PASSWORD_JUGADOR }}
        run: npx playwright test e2e/division.spec.js   # SU archivo: sin esto correría también la integración
        working-directory: ./frontend

      - name: Resumen de la e2e
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/resumen-playwright.js "e2e (front de QA)" >> "$GITHUB_STEP_SUMMARY"
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}         # el reporte importa MÁS cuando falla
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 90

  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read # sólo dispara hooks y hace curl: no escribe nada en el repo
    needs: e2e                        # ← EL gate: sin integración y e2e verdes, ni se pide aprobación
    environment: production           # ⏸ acá el workflow se pausa hasta que alguien apruebe
    concurrency:
      group: deploy-prod              # nunca dos deploys a PROD pisándose
      cancel-in-progress: false
    steps:
      # La MISMA imagen que se desplegó en QA: mismo sha-<commit>, nada se reconstruye.
      # Entre que la corrida queda esperando aprobación y que alguien aprueba pueden pasar
      # horas, y main se mueve: el imgURL sigue nombrando la imagen que se aprobó.
      - name: Desplegar en PROD la MISMA imagen que verificó QA (api + front)
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que PROD conteste con este commit)
        shell: bash
        env:
          URL_API: https://club-tablada-api-prod.onrender.com
          URL_FRONT: https://club-tablada-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD corra $GITHUB_SHA..."
          for i in $(seq 1 30); do
            HEALTH=$(curl -fsS --max-time 10 "$URL_API/api/v1/health/" || true)
            echo "intento $i: $HEALTH"
            if [[ "$HEALTH" == *"\"commit\":\"$GITHUB_SHA\""* ]] \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/v1/health/" > /dev/null; then
              echo "✅ PROD responde con $GITHUB_SHA (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió con este commit a tiempo"; exit 1